---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload PostgreSQL configuration
  ansible.builtin.command:
    argv:
      - "/usr/lib/postgresql/{{ postgresql_version }}/bin/pg_ctl"
      - reload
      - -D
      - "{{ pgdata_path }}"
  become_user: postgres
  changed_when: true

- name: Restart pg_autoctl
  ansible.builtin.systemd:
    name: "{{ pg_autoctl_service_name }}"
    state: restarted
    daemon_reload: true

