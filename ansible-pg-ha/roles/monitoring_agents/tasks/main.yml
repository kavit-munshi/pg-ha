---
- name: Install Prometheus node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start Prometheus node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Install PostgreSQL exporter on database hosts
  ansible.builtin.apt:
    name: prometheus-postgres-exporter
    state: present
  when: inventory_hostname in groups['db_cluster']

- name: Configure PostgreSQL exporter connection
  ansible.builtin.template:
    src: postgres-exporter.env.j2
    dest: /etc/default/prometheus-postgres-exporter
    owner: root
    group: prometheus
    mode: "0640"
  no_log: true
  notify: Restart PostgreSQL exporter
  when: inventory_hostname in groups['db_cluster']

- name: Enable and start PostgreSQL exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    enabled: true
    state: started
  when: inventory_hostname in groups['db_cluster']

- name: Collect installed package facts on routing hosts
  ansible.builtin.package_facts:
    manager: auto
  when: inventory_hostname in groups['routing_nodes']

- name: Stop legacy Python PgBouncer exporter
  ansible.builtin.systemd:
    name: prometheus-pgbouncer-exporter
    enabled: false
    state: stopped
  failed_when: false
  when:
    - inventory_hostname in groups['routing_nodes']
    - "'prometheus-pgbouncer-exporter' in ansible_facts.packages"

- name: Remove incompatible legacy Python PgBouncer exporter
  ansible.builtin.apt:
    name: prometheus-pgbouncer-exporter
    state: absent
    purge: true
  when:
    - inventory_hostname in groups['routing_nodes']
    - "'prometheus-pgbouncer-exporter' in ansible_facts.packages"

- name: Install Prometheus Community PgBouncer exporter
  ansible.builtin.apt:
    name: "{{ pgbouncer_exporter_package }}"
    state: present
  when: inventory_hostname in groups['routing_nodes']

- name: Verify Prometheus Community PgBouncer exporter binary
  ansible.builtin.stat:
    path: "{{ pgbouncer_exporter_bin }}"
  register: monitoring_agents_pgbouncer_exporter_binary
  when: inventory_hostname in groups['routing_nodes']

- name: Require Prometheus Community PgBouncer exporter binary
  ansible.builtin.assert:
    that:
      - monitoring_agents_pgbouncer_exporter_binary.stat.exists
      - monitoring_agents_pgbouncer_exporter_binary.stat.executable
    fail_msg: >-
      Package {{ pgbouncer_exporter_package }} did not install the expected
      executable {{ pgbouncer_exporter_bin }}.
  when: inventory_hostname in groups['routing_nodes']

- name: Remove legacy PgBouncer exporter configuration
  ansible.builtin.file:
    path: /etc/prometheus-pgbouncer-exporter.conf
    state: absent
  when: inventory_hostname in groups['routing_nodes']

- name: Remove legacy PgBouncer exporter systemd override
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-pgbouncer-exporter.service.d
    state: absent
  notify: Reload systemd for exporters
  when: inventory_hostname in groups['routing_nodes']

- name: Configure PgBouncer exporter environment
  ansible.builtin.template:
    src: pgbouncer-exporter.env.j2
    dest: /etc/default/prometheus-pgbouncer-exporter
    owner: root
    group: prometheus
    mode: "0640"
  no_log: true
  notify: Restart PgBouncer exporter
  when: inventory_hostname in groups['routing_nodes']

- name: Configure PgBouncer exporter password file
  ansible.builtin.template:
    src: pgbouncer-exporter.pgpass.j2
    dest: /etc/prometheus-pgbouncer-exporter.pgpass
    owner: prometheus
    group: prometheus
    mode: "0600"
  no_log: true
  notify: Restart PgBouncer exporter
  when: inventory_hostname in groups['routing_nodes']

- name: Install Prometheus Community PgBouncer exporter service
  ansible.builtin.template:
    src: prometheus-pgbouncer-exporter.service.j2
    dest: /etc/systemd/system/prometheus-pgbouncer-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for exporters
    - Restart PgBouncer exporter
  when: inventory_hostname in groups['routing_nodes']

- name: Enable and start PgBouncer exporter
  ansible.builtin.systemd:
    name: prometheus-pgbouncer-exporter
    enabled: true
    state: started
    daemon_reload: true
  when: inventory_hostname in groups['routing_nodes']

- name: Apply PgBouncer exporter handler changes
  ansible.builtin.meta: flush_handlers

- name: Wait for PgBouncer exporter to remain active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - prometheus-pgbouncer-exporter.service
  register: monitoring_agents_pgbouncer_exporter_active
  changed_when: false
  failed_when: false
  retries: 5
  delay: 2
  until: monitoring_agents_pgbouncer_exporter_active.rc == 0
  when: inventory_hostname in groups['routing_nodes']

- name: Read PgBouncer exporter journal after startup failure
  ansible.builtin.command:
    argv:
      - journalctl
      - --unit
      - prometheus-pgbouncer-exporter.service
      - --lines
      - "100"
      - --no-pager
  register: monitoring_agents_pgbouncer_exporter_journal
  changed_when: false
  when:
    - inventory_hostname in groups['routing_nodes']
    - monitoring_agents_pgbouncer_exporter_active.rc != 0

- name: Report PgBouncer exporter startup failure
  ansible.builtin.fail:
    msg: |-
      prometheus-pgbouncer-exporter did not remain active. Recent journal:
      {{ monitoring_agents_pgbouncer_exporter_journal.stdout }}
  when:
    - inventory_hostname in groups['routing_nodes']
    - monitoring_agents_pgbouncer_exporter_active.rc != 0

- name: Configure optional Logstash forwarding
  ansible.builtin.template:
    src: logstash-forwarding.conf.j2
    dest: /etc/rsyslog.d/60-logstash-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when: configure_logstash_forwarding | bool

- name: Remove Logstash forwarding when disabled
  ansible.builtin.file:
    path: /etc/rsyslog.d/60-logstash-forwarding.conf
    state: absent
  notify: Restart rsyslog
  when: not (configure_logstash_forwarding | bool)
