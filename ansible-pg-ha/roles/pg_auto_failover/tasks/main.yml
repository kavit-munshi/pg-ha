---
- name: Install PostgreSQL repository signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/postgresql-pgdg.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the official PostgreSQL PGDG repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/postgresql-pgdg.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    filename: pgdg
    state: present
    update_cache: true

- name: Install PostgreSQL 18 and pg_auto_failover
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - "postgresql-{{ postgresql_version }}-auto-failover"
      - pg-auto-failover-cli
      - python3-psycopg
    state: present

- name: Verify pg_autoctl is installed
  ansible.builtin.command:
    argv:
      - pg_autoctl
      - version
  changed_when: false

- name: Detect package-created PostgreSQL cluster
  ansible.builtin.command:
    cmd: pg_lsclusters --no-header
  register: pg_auto_failover_package_clusters
  changed_when: false
  failed_when: false

- name: Remove unused package-created main cluster
  ansible.builtin.command:
    cmd: "pg_dropcluster --stop {{ postgresql_version }} main"
  when:
    - pg_auto_failover_package_clusters.rc == 0
    - >-
      pg_auto_failover_package_clusters.stdout is
      search('^' + (postgresql_version | string) + '\\s+main\\s', multiline=True)
  changed_when: true

- name: Disable Debian cluster wrapper service
  ansible.builtin.systemd:
    name: postgresql.service
    enabled: false
    state: stopped
  failed_when: false

- name: Ensure postgres can traverse the PostgreSQL storage root
  ansible.builtin.file:
    path: /pgdata
    state: directory
    owner: root
    group: postgres
    mode: "0750"

- name: Set ownership on the PostgreSQL data filesystem root
  ansible.builtin.file:
    path: "{{ pgdata_mount_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Set ownership on PostgreSQL LVM paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ pgdata_path }}"
    - "{{ pgwal_path }}"
    - "{{ pgbackup_path }}"
    - "{{ pglog_path }}"
    - "{{ pgtemp_path }}"
    - "{{ pgbinary_path }}"
    - "{{ pginstance_path }}"

- name: Verify the PostgreSQL data filesystem is mounted at its parent path
  ansible.builtin.command:
    argv:
      - /usr/bin/mountpoint
      - -q
      - "{{ pgdata_mount_path }}"
  register: pg_auto_failover_data_root_mount
  changed_when: false
  failed_when: pg_auto_failover_data_root_mount.rc != 0

- name: Check that PGDATA is not itself a mountpoint
  ansible.builtin.command:
    argv:
      - /usr/bin/mountpoint
      - -q
      - "{{ pgdata_path }}"
  register: pg_auto_failover_pgdata_mount_check
  changed_when: false
  failed_when: false

- name: Reject a PGDATA mountpoint that pg_autoctl cannot atomically replace
  ansible.builtin.assert:
    that:
      - pg_auto_failover_pgdata_mount_check.rc != 0
    fail_msg: >-
      {{ pgdata_path }} must be a normal directory, not a mountpoint. Mount
      lv_data at {{ pgdata_mount_path }} so pg_autoctl can atomically replace
      PGDATA after pg_basebackup.

- name: Inspect PGDATA and backup staging filesystems
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ pgdata_path }}"
    - "{{ pgbackup_path }}"
  register: pg_auto_failover_data_filesystems

- name: Require PGDATA and backup staging on the same filesystem
  ansible.builtin.assert:
    that:
      - >-
        pg_auto_failover_data_filesystems.results[0].stat.dev ==
        pg_auto_failover_data_filesystems.results[1].stat.dev
    fail_msg: >-
      {{ pgdata_path }} and {{ pgbackup_path }} must be on the same filesystem
      for pg_autoctl's atomic standby replacement.

- name: Verify postgres can write to PostgreSQL storage paths
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -w
      - "{{ item }}"
  become: true
  become_user: postgres
  changed_when: false
  loop:
    - "{{ pgdata_path }}"
    - "{{ pgwal_path }}"
    - "{{ pgbackup_path }}"
    - "{{ pglog_path }}"
    - "{{ pgtemp_path }}"
    - "{{ pgbinary_path }}"
    - "{{ pginstance_path }}"

- name: Install pg_autoctl systemd unit
  ansible.builtin.template:
    src: pg_autoctl.service.j2
    dest: /etc/systemd/system/pg_autoctl.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd unit handler
  ansible.builtin.meta: flush_handlers

- name: Initialize monitor node
  ansible.builtin.include_tasks: monitor.yml
  when: inventory_hostname in groups['db_monitor']

- name: Initialize PostgreSQL data node
  ansible.builtin.include_tasks: postgres_node.yml
  when: inventory_hostname in (groups['db_primary'] + groups['db_standby'])
