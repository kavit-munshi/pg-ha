[defaults]
inventory = ./inventories/uat_hosts.ini
roles_path = ./roles
# Keep controller-side dependencies and temporary files project-local. This
# avoids relying on passwd/home-directory expansion for hardened or
# directory-backed operator accounts.
collections_path = ./collections:/usr/share/ansible/collections
local_tmp = ./.ansible/tmp
host_key_checking = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
become = True
become_method = sudo
