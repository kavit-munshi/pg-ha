---
- name: Validate deployment inputs
  hosts: all_nodes
  gather_facts: false
  become: false
  tasks:
    - name: Validate required secrets and host mappings
      ansible.builtin.assert:
        that:
          - host_ips[inventory_hostname] | length > 0
          - (ansible_host | string) == (host_ips[inventory_hostname] | string)
          - cluster_cidr | length > 0
          - application_client_cidrs | type_debug == 'list'
          - application_client_cidrs | length >= 1
          - "'any' not in application_client_cidrs"
          - "'0.0.0.0/0' not in application_client_cidrs"
          - postgresql_vip | length > 0
          - prometheus_scrape_cidr | length > 0
          - keepalived_interface | length > 0
          - keepalived_interface != "CHANGE_ME"
          - >-
            deployment_environment != 'prod' or
            postgresql_vip_hostname | length > 0
          - >-
            not (configure_logstash_forwarding | bool) or
            logstash_ip != "CHANGE_ME"
          - ntp_servers | length >= 1
          - postgresql_wal_archive_provider in ['monitor_ssh', 'rubrik', 'none']
          - >-
            postgresql_wal_archive_provider != 'rubrik' or
            rubrik_wal_cutover_confirmed | bool or
            wal_archive_cleanup_force | bool
          - pg_auto_failover_monitor_password != "CHANGE_ME"
          - pg_auto_failover_replication_password != "CHANGE_ME"
          - app_db_password != "CHANGE_ME"
          - postgres_exporter_password != "CHANGE_ME"
          - haproxy_health_password != "CHANGE_ME"
          - keepalived_auth_pass != "CHANGE_ME"
        fail_msg: >-
          Replace all required CHANGE_ME values (preferably with Ansible Vault),
          confirm the VIP/interface/NTP/client/monitoring inputs, and verify that
          every inventory ansible_host exactly matches its host_ips entry before
          deployment. For Rubrik, also confirm a successful base backup and
          durable WAL configuration by setting rubrik_wal_cutover_confirmed=true.
          Use wal_archive_cleanup_force=true only for an approved emergency
          removal that intentionally bypasses Rubrik readiness validation.

- name: Prepare operating systems, time synchronization, and storage
  hosts: all_nodes
  become: true
  roles:
    - ufw_firewall
    - os_tuning
    - role: storage_lvm
      when: storage_lvm_enabled | default(false) | bool
      tags:
        - storage

- name: Create pg_auto_failover monitor
  hosts: db_monitor
  become: true
  roles:
    - pg_auto_failover

- name: Create pg_auto_failover primary
  hosts: db_primary
  become: true
  roles:
    - pg_auto_failover

- name: Create pg_auto_failover standby
  hosts: db_standby
  become: true
  roles:
    - pg_auto_failover

- name: Configure database users and backup integration
  hosts: db_primary:db_standby:db_monitor
  serial: 1
  become: true
  roles:
    - role: database_bootstrap
      tags:
        - database_bootstrap
    - role: backup_wal
      when: postgresql_wal_archive_provider == 'monitor_ssh'
      tags:
        - backup_wal
    - role: wal_archive_cleanup
      when: postgresql_wal_archive_provider != 'monitor_ssh'
      tags:
        - backup_wal
        - wal_archive_cleanup

- name: Configure connection and routing tier
  hosts: routing_nodes
  become: true
  roles:
    - role: pgbouncer
      tags:
        - pgbouncer
        - routing
    - role: keepalived_haproxy
      tags:
        - keepalived_haproxy
        - routing

- name: Install monitoring agents
  hosts: all_nodes
  become: true
  roles:
    - role: monitoring_agents
      tags:
        - monitoring
