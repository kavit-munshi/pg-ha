---
ansible_user: ansible
ansible_become: true
ansible_python_interpreter: /usr/bin/python3

# Define ansible_host explicitly on every inventory host. Do not derive the
# connection address from inventory_hostname here: inventory_hostname remains
# the original host during delegation and can therefore send a delegated task
# to the wrong server.

postgresql_version: 18
postgresql_port: 5432
pgdata_mount_path: /pgdata/pgroot
pgdata_path: /pgdata/pgroot/data
pgwal_path: /pgdata/wal
pgbackup_path: /pgdata/pgroot/backup
pglog_path: /pgdata/log
pgtemp_path: /pgdata/tmp
pgbinary_path: /pgdata/binaries
pginstance_path: /pgdata/dbinst
pg_autoctl_config_path: "/var/lib/postgresql/.config/pg_autoctl{{ pgdata_path }}/pg_autoctl.cfg"
wal_archive_path: /pgdata/WalArchive
wal_archive_ssh_group: postgres-wal-ssh
# Selects the owner of PostgreSQL archived-WAL protection. Supported values:
#   monitor_ssh - legacy Ansible SSH/rsync archive on the monitor node
#   rubrik      - Rubrik owns archive_mode/archive_command and WAL retention
#   none        - no archived-WAL provider (streaming replication still uses WAL)
# New environments default to no provider and must opt in deliberately.
postgresql_wal_archive_provider: none
# Explicit safety gate. Set true only after the selected environment has a
# successful Rubrik base backup and durable Rubrik WAL configuration on both
# data candidates. The cleanup role refuses to make changes while false.
rubrik_wal_cutover_confirmed: false
# Emergency override for removing the legacy monitor WAL integration before
# Rubrik readiness can be confirmed. This bypasses only the cleanup gates and
# provider validation; it does not claim that backups are healthy. Keep false
# for normal deployments and pass true only through an approved change.
wal_archive_cleanup_force: false
# Optional regular expression used to identify the Rubrik archive command.
# Leave empty when the Rubrik command varies by release; health tests still
# require a nonempty, non-legacy command when the provider is rubrik.
rubrik_archive_command_validation_pattern: ""
# Completed WAL segments are still shipped immediately by archive_command.
# This interval forces the active primary to close a partially filled segment
# at least once per hour when the legacy monitor_ssh provider is selected.
backup_wal_force_switch_enabled: true
backup_wal_force_switch_interval: 60min
backup_wal_archive_timeout: 3600s
pg_autoctl_bin: /usr/bin/pg_autoctl
pg_autoctl_service_name: pg_autoctl
pg_auto_failover_db: pg_auto_failover
pg_auto_failover_user: autoctl_node
pg_auto_failover_replication_user: pgautofailover_replicator

app_database: qms
app_db_user: qms_app
# PgBouncer is local to each routing node. It sends server connections to the
# loopback-only HAProxy primary selector instead of being paired with one fixed
# PostgreSQL node. The selector health-checks both data nodes and enables only
# the node that currently reports pg_is_in_recovery() = false.
pgbouncer_listen_address: 127.0.0.1
pgbouncer_listen_port: 6432
pgbouncer_max_client_conn: 5000
pgbouncer_default_pool_size: 100
pgbouncer_max_prepared_statements: 100
pgbouncer_pool_mode: transaction

haproxy_listen_port: 5432
haproxy_primary_selector_address: 127.0.0.1
haproxy_primary_selector_port: 6433
haproxy_stats_port: 8404
postgresql_vip_hostname: ""
# Default for UAT; Production overrides this in group_vars/prod.yml.
keepalived_interface: ens33
keepalived_virtual_router_id: 51
keepalived_check_interval: 2

# Time Synchronization / NTP Settings
ntp_servers:
  - 0.ca.pool.ntp.org
  - 1.ca.pool.ntp.org
  - 2.ca.pool.ntp.org
  - 3.ca.pool.ntp.org
chrony_service_name: chrony

postgres_shared_buffers: 8GB
postgres_effective_cache_size: 24GB
postgres_work_mem: 16MB
postgres_maintenance_work_mem: 2GB
postgres_max_connections: 500

metrics_allowed_cidr: "{{ prometheus_scrape_cidr }}"
node_exporter_port: 9100
postgres_exporter_port: 9187
pgbouncer_exporter_port: 9127
pgbouncer_exporter_package: golang-github-prometheus-community-pgbouncer-exporter
pgbouncer_exporter_bin: /usr/bin/pgbouncer_exporter
postgres_exporter_user: postgres_exporter
haproxy_health_user: haproxy_check

# UFW is rebuilt from the declared role matrix so unmanaged rules cannot leave
# unintended ports exposed. Set false only during an explicitly approved
# firewall migration that preserves pre-existing rules.
ufw_reset_rules: true
ufw_ssh_allowed_cidrs:
  - any
# Application clients enter through the routing VIP. Database-node port 5432
# remains private to the cluster tier unless a separately reviewed direct-access
# design also provisions matching PostgreSQL pg_hba.conf rules.
ufw_database_allowed_cidrs:
  - "{{ cluster_cidr }}"

# Rubrik PostgreSQL protection is enabled only from explicitly approved Rubrik
# cluster/source addresses. UAT and Production must override the empty list.
# "any" and ::/0 are prohibited; 0.0.0.0/0 requires an explicit break-glass
# acknowledgement and should be replaced with Rubrik /32 entries. Rubrik CDM reaches RBS on the inbound
# ports. WAL/log and NFS data traffic are initiated by the database host toward
# Rubrik. Explicit outbound rules document those flows even though the global
# UFW policy currently allows outgoing traffic by default.
rubrik_firewall_enabled: >-
  {{ postgresql_wal_archive_provider == 'rubrik' }}
# Break-glass acknowledgement for a world-scoped Rubrik source. Keep false in
# normal environments and use explicit Rubrik node /32 entries instead.
rubrik_allow_world_source: false
rubrik_allowed_cidrs: []
rubrik_inbound_tcp_ports:
  - "12800"
  - "12801"
rubrik_outbound_tcp_ports:
  - "111"
  - "9639"
  - "32764:32769"
rubrik_outbound_udp_ports:
  - "111"
  - "32764:32769"
configure_logstash_forwarding: false
logstash_port: 514
rubrik_rbs_enabled: false
rubrik_rbs_hook_command: /opt/rubrik/bin/rbs-post-wal-archive

storage_vg_name: vg_pgdata
storage_db_device: /dev/sdb
storage_monitor_vg_device: /dev/sdc
storage_archive_device: /dev/sdb
storage_routing_device: /dev/sdb
storage_db_lvs:
  - { name: lv_data, size: 100g, mount: /pgdata/pgroot }
  - { name: lv_wal, size: 300g, mount: /pgdata/wal }
  - { name: lv_log, size: 30g, mount: /pgdata/log }
  - { name: lv_tmp, size: 30g, mount: /pgdata/tmp }
  - { name: lv_binaries, size: 100g, mount: /pgdata/binaries }
  - { name: lv_dbinst, size: 100g, mount: /pgdata/dbinst }

sysctl_settings:
  vm.swappiness: "10"
  vm.overcommit_memory: "2"
  net.core.somaxconn: "4096"

