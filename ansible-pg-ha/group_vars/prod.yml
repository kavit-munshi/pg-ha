---
deployment_environment: prod
storage_lvm_enabled: false
host_ips:
  BHC-QMSSQLU05: 10.50.10.55
  BHC-QMSSQLU06: 10.50.10.56
  BHC-QMSSQLU07: 10.50.10.57
  BHC-PGBSQLU03: 10.50.10.63
  BHC-PGBSQLU04: 10.50.10.64
cluster_cidr: 10.50.10.0/24
prometheus_scrape_cidr: 10.50.20.0/24
application_client_cidr: 10.50.30.0/24
postgresql_vip: 10.50.10.50
postgresql_vip_prefix: 24
# Confirm the Production VIP-facing interface before deployment.
keepalived_interface: ens192
