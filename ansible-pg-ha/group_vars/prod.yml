  - 1.ca.pool.ntp.org
  - 2.ca.pool.ntp.org
  - 3.ca.pool.ntp.org

# Override these with ansible-vault encrypt_string or an encrypted vars file.
pg_auto_failover_monitor_password: CHANGE_ME
pg_auto_failover_replication_password: CHANGE_ME
